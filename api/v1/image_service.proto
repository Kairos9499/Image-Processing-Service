syntax = "proto3";

package image.v1;
option go_package = "image-processing-service/gen/image/v1;imagev1";

service ImageService {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc DownloadResult(DownloadResultRequest) returns (DownloadResultResponse);
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_PROCESSING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
}

enum OutputFormat { OUTPUT_FORMAT_UNSPECIFIED = 0; OUTPUT_FORMAT_JPEG = 1; OUTPUT_FORMAT_PNG = 2; }
enum Operation { OPERATION_UNSPECIFIED = 0; OPERATION_RESIZE = 1; OPERATION_GRAYSCALE = 2; OPERATION_THUMBNAIL = 3; }

message CreateJobRequest {
  bytes image = 1;
  string filename = 2;
  Operation operation = 3;
  uint32 width = 4;
  uint32 height = 5;
  OutputFormat output_format = 6;
}
message CreateJobResponse { string job_id = 1; JobStatus status = 2; }
message GetJobRequest { string job_id = 1; }
message GetJobResponse {
  string job_id = 1; JobStatus status = 2; string input_filename = 3;
  string result_filename = 4; string error = 5; int64 created_at_unix = 6; int64 updated_at_unix = 7;
  uint32 width = 8; uint32 height = 9; int64 result_size_bytes = 10;
}
message DownloadResultRequest { string job_id = 1; }
message DownloadResultResponse { bytes image = 1; string filename = 2; string content_type = 3; }
